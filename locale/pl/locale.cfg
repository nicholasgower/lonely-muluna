[space-location-description]
nauvis=Suchy świat z płytkimi jeziorami. Bogaty w wodę, żelazo, miedź, węgiel, ropę i uran. Występują tu wrogie gatunki tubylcze. Powierzchnia pokryta jest śmieciami z innej epoki.
fulgora=Pozostałości dawno zniszczonej planety.
muluna= Samotna planeta karłowata wyrzucona na zewnętrzne krańce układu Calidus.
gleba=Wilgotna, bagnista planeta z głębokimi torfowiskami, wijącymi się wzgórzami, wyładowaniami atmosferycznymi i żyzną ziemią. Bogata w składniki odżywcze. Tereny bagienne można zasypać. Wysokie tereny utrudniają budowę linii kolejowych, ale są niezbędne dla rolnictwa.

